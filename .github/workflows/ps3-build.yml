name: PS3 Dynamic Date Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Download PS3DEV
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/ps3dev"

          curl -fL \
            "https://github.com/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz" \
            -o ps3dev.tar.gz

          tar -xzf ps3dev.tar.gz -C "$GITHUB_WORKSPACE"

          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Inspect PS3 SDK
        run: |
          echo "PS3DEV=$PS3DEV"
          find "$PS3DEV" -maxdepth 3 -type d | sort | head -100
          find "$PS3DEV" -name 'ppu_rules' -o -name 'libsysutil.a' -o -name 'libgcm_sys.a'

      - name: Verify PSL1GHT graphics SDK
        run: |
          echo "Checking PS3 graphics headers..."
          test -f "$PS3DEV/ppu/include/rsx/rsx.h"
          test -f "$PS3DEV/ppu/include/rsx/gcm_sys.h"

          echo "Checking libraries..."
          test -f "$PS3DEV/ppu/lib/libgcm_sys.a"
          test -f "$PS3DEV/ppu/lib/libsysutil.a"

          echo "PSL1GHT graphics SDK checks passed!"

      - name: Verify compiler
        run: |
          test -x "$PS3DEV/ppu/bin/ppu-gcc"
          ppu-gcc --version

      - name: Build PS3 homebrew package
        run: |
          set -e
          test -f "$PS3DEV/bin/ICON0.PNG"
          make -C ps3 clean
          make -C ps3
          make -C ps3 pkg

          echo "=== Generated files ==="
          ls -lh ps3/ps3-dynamic-date.elf
          ls -lh ps3/ps3-dynamic-date.self
          ls -lh ps3/ps3-dynamic-date.pkg

          echo "=== ELF architecture ==="
          file ps3/ps3-dynamic-date.elf
          readelf -h ps3/ps3-dynamic-date.elf

          echo "=== Package contents ==="
          find ps3/build -type f -maxdepth 5 -print
          echo "=== EBOOT.BIN check ==="
          find ps3 -name EBOOT.BIN -exec file {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps3-dynamic-date-homebrew
          path: |
            ps3/ps3-dynamic-date.elf
            ps3/ps3-dynamic-date.self
            ps3/ps3-dynamic-date.fake.self
            ps3/ps3-dynamic-date.pkg
